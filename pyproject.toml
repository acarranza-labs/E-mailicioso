[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e-mailicioso"
description = "Portable email forensics toolkit for SOC analysts: headers, authentication, links, attachments, IOCs and KQL hunting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Antonio Carranza" }]
keywords = ["email", "phishing", "forensics", "soc", "dfir", "eml", "msg", "ioc", "kql", "defender"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Communications :: Email",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tldextract>=5.1",
    "requests>=2.31",
]
dynamic = ["version"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
msg = ["extract-msg>=0.48"]
qr = ["opencv-python-headless>=4.8", "numpy"]
screenshots = ["playwright>=1.40"]
all = ["e-mailicioso[gui,msg,qr,screenshots]"]
dev = ["pytest>=8", "ruff>=0.5", "qrcode[pil]>=7"]

[project.scripts]
emailicioso = "emailicioso.cli:main"

[project.urls]
Homepage = "https://github.com/acarranza-labs/E-mailicioso"
Issues = "https://github.com/acarranza-labs/E-mailicioso/issues"

[tool.setuptools.dynamic]
version = { attr = "emailicioso.__version__" }

[tool.setuptools.packages.find]
include = ["emailicioso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["emailicioso", "conftest"]
